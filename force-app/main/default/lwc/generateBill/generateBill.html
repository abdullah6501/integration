<template>
    <lightning-card title="Create Bill" icon-name="standard:quotes">
        <div class="slds-p-around_large">
            <template if:true={isLoading}>
                <div class="slds-text-align_center slds-m-bottom_large">
                    <lightning-spinner alternative-text="Checking existing bills..." size="small"></lightning-spinner>
                    <p class="slds-text-body_small slds-m-top_small">Checking for existing bills...</p>
                </div>
            </template>

            <template if:false={isLoading}>
                <div class="slds-m-bottom_large slds-text-align_center">
                    <p class="slds-text-body_regular">
                        {billExistsMessage}
                    </p>
                </div>
                <div class="slds-text-align_center">
                    <lightning-button 
                        label="Cancel" 
                        variant="neutral"
                        onclick={handleCancel}
                        class="slds-m-right_small">
                    </lightning-button>
                    <lightning-button
                        label="Save"
                        variant="brand"
                        onclick={handleCreateBill}
                        disabled={isProcessing}>
                    </lightning-button>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
