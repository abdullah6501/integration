<template>
    <div class="custom-modal-wrapper">
        <div class="custom-modal-content">
            
            <div class="custom-modal-header">
                <h2 class="slds-text-heading_medium">Bill Payments</h2>
            </div>

            <div class="custom-modal-body">
                <div class="slds-text-body_regular slds-m-bottom_small">
                    <strong>Bill Number:</strong> {billName}
                </div>

                <div class="slds-text-title_bold slds-p-around_x-small payments-section-header">
                    Payments Information
                </div>
                <lightning-layout multiple-rows class="slds-m-vertical_small">
                    <lightning-layout-item size="4" padding="horizontal-small">
                        <lightning-input label="Payment Cost" 
                                         name="paymentCost" 
                                         value={paymentCost}
                                         type="number" 
                                         step="0.01"
                                         placeholder="Ex.00" 
                                         required
                                         onchange={handleChange}>
                        </lightning-input>
                    </lightning-layout-item>

                    <lightning-layout-item size="4" padding="horizontal-small">
                        <lightning-combobox name="paymentMode" 
                                            label="Payment Mode" 
                                            placeholder="--Select the Category--" 
                                            value={paymentMode} 
                                            options={paymentOptions} 
                                            required 
                                            onchange={handleChange}>
                        </lightning-combobox>
                    </lightning-layout-item>

                    <lightning-layout-item size="4" padding="horizontal-small">
                        <lightning-input type="date" 
                                         name="paymentDate" 
                                         value={paymentDate}
                                         label="Payment Date" 
                                         required
                                         onchange={handleChange}>
                        </lightning-input>
                    </lightning-layout-item>

                    <lightning-layout-item size="12" padding="horizontal-small">
                        <lightning-input label="Vendor Name" value={accountName} disabled></lightning-input>
                    </lightning-layout-item>
                </lightning-layout>

                <div class="slds-text-title_bold slds-p-around_x-small slds-m-top_medium additional-info-header">
                    Additional Information
                </div>
                <lightning-layout multiple-rows class="slds-m-vertical_small">
                    <lightning-layout-item size="6" padding="horizontal-small">
                        <lightning-input label="Bill Name" value={billName} disabled></lightning-input>
                    </lightning-layout-item>

                    <lightning-layout-item size="6" padding="horizontal-small">
                        <lightning-input label="Due Balance" value={dueBalance} disabled></lightning-input>
                    </lightning-layout-item>

                    <lightning-layout-item size="6" padding="horizontal-small">
                        <lightning-input label="Early Paid Amount" value={earlyPaidAmount} disabled></lightning-input>
                    </lightning-layout-item>

                    <!--<lightning-layout-item size="6" padding="horizontal-small">
                        <lightning-input label="Bank Charges (If Any)" 
                                         name="bankCharges" 
                                         value={bankCharges}
                                         type="number" 
                                         placeholder="Ex.00" 
                                         onchange={handleChange}>
                        </lightning-input>
                    </lightning-layout-item>-->
                </lightning-layout>
            </div>

            <div class="custom-modal-footer">
                <lightning-button label="Cancel" onclick={handleCancel} class="slds-m-right_small"></lightning-button>
                <lightning-button variant="brand" label="Save" onclick={handleSave} disabled={isSaveDisabled}></lightning-button>
            </div>
        </div>
    </div>
</template>
