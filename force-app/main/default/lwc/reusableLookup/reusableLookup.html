<template>
    <div class="slds-form-element">
        <div class="slds-form-element__control">
            <div class="slds-combobox_container" if:false={isValueSelected}>
                <div class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click slds-is-open">
                    <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right" role="none">
                        <lightning-input disabled={disableFlag} onchange={handleChange} type="search" autocomplete="off"
                            label={label} required={required} field-level-help={helpText} placeholder={placeholder} onclick={handlefetchrecordlist}
                            onblur={handleInputBlur}></lightning-input>
                    </div>
                </div>
            </div>
            <template if:true={isValueSelected}>
                <label class="slds-form-element__label" for="combobox-id-5" id="combobox-label-id-35">{label}</label>
                <template if:true={required}>
                    <span style="color:red">*</span>
                </template>
                <div tabindex="0" class="slds-combobox_container slds-has-selection">
                    <div class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click">
                        <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_left-right"
                            role="none">
                            <span
                                class="slds-icon_container slds-icon-standard-account slds-combobox__input-entity-icon"
                                title="Account">
                                <lightning-icon icon-name={selectedIconName} alternative-text={selectedIconName}
                                    size="x-small"></lightning-icon>
                            </span>
                            <button type="button" disabled={disableFlag}
                                class="slds-input_faux slds-combobox__input slds-combobox__input-value"
                                aria-labelledby="combobox-label-id-34 combobox-id-5-selected-value"
                                id="combobox-id-5-selected-value" aria-controls="listbox-id-5" aria-expanded="false"
                                aria-haspopup="listbox">
                                <span class="slds-truncate" id="combobox-value-id-19">{selectedRecordName}</span>
                            </button>
                            <button class="slds-button slds-button_icon slds-input__icon slds-input__icon_right"
                                disabled={disableFlag} title="Remove selected option" onclick={handleCommit}>
                                <lightning-icon icon-name="utility:close" alternative-text="Remove selected option"
                                    size="x-small"></lightning-icon>
                            </button>
                        </div>
                    </div>
                </div>
            </template>
            <template if:true={showRecentRecords}>
                <div id="listbox-id-4" tabindex="0" onblur={handleBlur} onmousedown={handleDivClick}
                    class="slds-dropdown slds-dropdown_length-with-icon-7 slds-dropdown_fluid" role="listbox">
                    <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                        <template for:each={recordsList} for:item="rec">
                            <li role="presentation" key={rec.id} class="slds-listbox__item">
                                <div onclick={handleSelect} data-id={rec.id} data-mainfield={rec.mainField}
                                    data-subfield={rec.subField} data-additionalfield={rec.additionalField}
                                    class="slds-media slds-listbox__option slds-listbox__option_entity slds-listbox__option_has-meta"
                                    role="option">
                                    <span class="slds-media__figure slds-listbox__option-icon">
                                        <lightning-icon icon-name={selectedIconName} alternative-text={selectedIconName}
                                            size="small"></lightning-icon>
                                    </span>
                                    <span class="slds-media__body">
                                        <span class="slds-listbox__option-text slds-listbox__option-text_entity">
                                            <span>
                                                <mark>{rec.mainField}</mark>
                                            </span>
                                        </span>
                                            <span class="slds-listbox__option-meta slds-listbox__option-meta_entity">
                                                {rec.subField}
                                            </span>
                                            <span class="slds-listbox__option-meta slds-listbox__option-meta_entity">
                                               
                                                <template if:true={rec.codeField}>{rec.codeField}</template>
                                            </span>
                                        <div if:true={journlentryflag}>
                                       
                                            <span class="slds-listbox__option-meta slds-listbox__option-meta_entity">
                                                {rec.relatedParentName}<template
                                                    if:true={rec.relatedParentName2}>/</template>{rec.relatedParentName2}
                                            </span>
 
                                        </div>
                                        <template if:false={journlentryflag} >
                                            <div if:false={productsearchflag}>
                                            <span class="slds-listbox__option-meta slds-listbox__option-meta_entity">
                                                {objectLabel} <!--• {rec.subField}-->
                                            </span>
                                        </div>
                                        </template>
                                    </span>
                                </div>
                            </li>
                        </template>
                        <template if:true={newrecord}>
                            <li role="presentation" class="slds-listbox__item">
                                <div class="slds-media slds-listbox__option slds-listbox__option_plain slds-p-horizontal_small"
                                    role="option" onclick={handleNewAccount}>
                                    <span class="slds-media__figure">
                                        <lightning-icon icon-name="utility:add" alternative-text="New" size="x-small"></lightning-icon>
                                    </span>
                                    <span class="slds-media__body">
                                        <span class="slds-listbox__option-text slds-listbox__option-text_entity ">
                                            New {objectLabel}
                                        </span>
                                    </span>
                                </div>
                            </li>
                        </template>
                    </ul>
                </div>
            </template>
            <template if:true={showNewRecords}>
    <div id="listbox-id-5" tabindex="0" 
        class="slds-dropdown slds-dropdown_length-with-icon-7 slds-dropdown_fluid" role="listbox">
        <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                <li role="presentation" class="slds-listbox__item">
                    <div class="slds-media slds-listbox__option slds-listbox__option_plain slds-p-horizontal_small"
                        role="option" onclick={handleNewAccount}>
                        <span class="slds-media__figure">
                            <lightning-icon icon-name="utility:add" alternative-text="New" size="x-small"></lightning-icon>
                        </span>
                        <span class="slds-media__body">
                            <span class="slds-listbox__option-text slds-listbox__option-text_entity ">
                            New {objectLabel}
                            </span>
                        </span>
                    </div>
                </li>
        </ul>
    </div>
            </template>

        </div>
    </div>
    <template if:true={isRecordTypeModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close" title="Close" onclick={handleCloseModal}>
                        <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                    </button>
                    <h2 class="slds-text-heading_medium">Select Record Type</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-combobox
                        label="Record Type"
                        options={recordTypeOptions}
                        value={selectedRecordType}
                        onchange={handleRecordTypeChange}>
                    </lightning-combobox>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button variant="neutral" label="Cancel" onclick={handleCloseModal} class="slds-m-right_small"></lightning-button>
                    <lightning-button variant="brand" label="Next" onclick={handleNext} class="slds-m-left_small"></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
    
    <!-- New Record Modal -->
    <template if:true={isNewRecordModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close" title="Close" onclick={handleCloseModal}>
                        <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                    </button>
                    <h2 class="slds-text-heading_medium">New {objectLabel}</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-record-form
                        record-type-id={selectedRecordType}
                        object-api-name={objectApiName}
                        layout-type="Compact"
                        mode="edit"
                        onsuccess={handleRecordCreated}
                        oncancel={handleCloseModal}>
                    </lightning-record-form>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
