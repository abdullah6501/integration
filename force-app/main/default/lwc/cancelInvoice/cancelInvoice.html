<template>
    <lightning-card title="Cancel E-Invoice">
        <div class="slds-p-around_medium">
            <lightning-input 
                label="Cancel Reason" 
                value={wrapper.cnlRsn} 
                data-field="cnlRsn"
                onchange={handleChange}>
            </lightning-input>

            <lightning-textarea 
                label="Remarks" 
                value={wrapper.cnlRem} 
                data-field="cnlRem"
                onchange={handleChange}>
            </lightning-textarea>

            <lightning-button 
                label="Cancel Invoice" 
                variant="destructive" 
                onclick={handleCancel} 
                class="slds-m-top_medium">
            </lightning-button>
        </div>
    </lightning-card>
</template>
