<!--AR 21/05/2025 So item Component with Discount and tax -->
<template>
    <template for:each={purchaseOrderDetails} for:item="item">
    <div key={item.Id} class="slds-grid slds-gutters slds-p-horizontal_medium slds-wrap slds-m-bottom_large">
        <div class="slds-col slds-size_1-of-4">
            <lightning-input 
                type="text" 
                label="Supplier"
                value={item.supplierNameField}
                disabled>
            </lightning-input>
        </div>
        <div class="slds-col slds-size_1-of-4">
            <lightning-input 
                type="text" 
                label="Payment Terms"
                value={item.paymentTerms}
                disabled>
            </lightning-input>
        </div>
        <div class="slds-col slds-size_1-of-4">
            <lightning-input 
                type="text" 
                label="Shipping Terms"
                value={item.shippingTerms}
                disabled>
            </lightning-input>
        </div>
    </div>
    </template>
<div class="slds-grid slds-gutters slds-p-horizontal_medium slds-wrap slds-m-bottom_large">
    <div class="slds-col slds-size_1-of-4">
        <lightning-combobox 
            name="Discount Type" 
            label="Discount Type" 
            value={discountTypeValue}
            options={discountType}
            onchange={handleDiscountTypeChange}>
        </lightning-combobox>
    </div>
    <div class="slds-col slds-size_1-of-4">
        <lightning-combobox 
            name="Discount Mode" 
            label="Discount Mode" 
            value={discountModeValue} 
            onchange={handleDiscountModeChange}
            options={discOptions}>
        </lightning-combobox>
    </div>
</div>
<lightning-card title="PO Items" >
    <table class="slds-table slds-table_bordered">
        <thead>
            <tr>
                <th></th>
                <th></th>
                <th>Product</th>
                <th style="width: 80px;">Stock</th>
                <th>Ordering Code</th>
                <th style="width: 120px;">Price Cost</th>
                <th style="width: 80px;">Quantity</th>
                    <template if:true={showDiscountAmount}>
                    <th style="width: 80px;">Disc Amount</th>
                   </template>
                   <template if:true={showDiscountPercentage}>
                    <th style="width: 80px;">Disc %</th>
                   </template>
                <template if:true={noneTax}>
                <th>Tax %</th>
                </template>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <template for:each={poItems} for:item="item" for:index="index">
                <tr key={item.id} draggable="true" 
                ondragstart={start} 
                ondragover={over} 
                ondrop={newDrop} 
                title={index}>
                <td class="tableStyle" role="gridcell">
                    <div style="padding-top:20px;">
                    <svg xmlns="http://www.w  m, 3.org/2000/svg" viewBox="0 0 256 256" id1="IconChangeColor" height="11" width="11"><rect width="256" height="256" fill="none"></rect><circle cx="60" cy="92" r="16"></circle><circle cx="128" cy="92" r="16"></circle><circle cx="196" cy="92" r="16"></circle><circle cx="60" cy="164" r="16"></circle><circle cx="128" cy="164" r="16"></circle><circle cx="196" cy="164" r="16"></circle></svg>
                    </div>
                  </td>
                <td>
                    <div style="padding-top:20px;">
                        {item.keyField}
                    </div>
                </td>    
                    <td>
                        <lightning-input type="Search" 
                            value={item.productName} 
                            data-index={index} 
                            onchange={handleProductSearch}>
                        </lightning-input>
                        <div if:true={item.searchResults.length} class="search-results">
                            <template for:each={item.searchResults} for:item="product">
                                <div key={product.id} data-id={product.id} data-index={index} onclick={selectProduct}>
                                    {product.name}
                                </div>
                            </template>
                        </div>
                    </td>
                    <td>
                        <lightning-input 
                            type="text" 
                            name="productQuantity" 
                            data-index={index} 
                            value={item.productQuantity} 
                            disabled 
                            class="small-width">
                        </lightning-input>
                    </td>
                   
                    <td>
                        <lightning-input type="text" 
                            name="productSku" 
                            data-index={index} 
                            value={item.productSku} 
                            disabled>
                        </lightning-input>
                    </td>
                    <td>
                        <!--AR 7/05/2025  changed api name for defect  IP-D-000000003-->
                        <lightning-input type="number" 
                            name="unitPrice" 
                            data-index={index} 
                            value={item.unitPrice} 
                            onchange={handleInputChange} 
                            step="0.01">
                        </lightning-input>
                    </td>
                    <td>
                        <lightning-input 
                            type="number" 
                            name="quantity" 
                            data-index={index} 
                            value={item.quantity} 
                            onchange={handleInputChange} 
                            class="small-width">
                        </lightning-input>
                    </td>
                        <template if:true={showDiscountAmount}>
                        <td>
                            <lightning-input 
                                type="number" 
                                name="discountAmount" 
                                data-index={index} 
                                value={item.discountAmount} 
                                onchange={handleInputChange} 
                                class="small-width">
                            </lightning-input>
                        </td>
                    </template>
                        <template if:true={showDiscountPercentage}>
                        <td>
                            <lightning-input 
                                type="number" 
                                name="discountPercentage" 
                                data-index={index} 
                                value={item.discountPercentage} 
                                onchange={handleInputChange} 
                                class="small-width">
                            </lightning-input>
                        </td>
                    </template>
                    <template if:true={noneTax}>
                    <td>
                        <lightning-combobox name="taxPercentage" 
                            data-index={index} 
                            value={item.taxPercentage} 
                            onchange={handleInputChange}
                            options={taxOptions}
                            style="width: 80px;">
                        </lightning-combobox>
                    </td>
                    </template>
                    <td>
                        <lightning-button-icon 
                            icon-name="utility:delete" 
                            alternative-text="Delete" 
                            variant="border-filled" 
                            class="slds-m-left_xx-small"
                            data-index={index}
                            onclick={deleteRow}>
                        </lightning-button-icon>
                    </td>
                </tr>
            </template>
        </tbody>
    </table>
    <div class="slds-m-top_medium" style="text-align: right;">
        <lightning-button label="Add Row" onclick={addRow}></lightning-button>
    </div>
    <div class="slds-grid slds-gutters slds-p-horizontal_medium slds-wrap" style="justify-content: flex-end">
        <template if:true={showLumpsumTax}>
            <div class="slds-col slds-size_1-of-4">
                <lightning-combobox
                    label="Lumpsum Tax Percentage"
                    name="lumpsumTaxPercentage"
                    value={lumpsumTaxPercentage}
                    options={taxOptions}
                    onchange={handleLumpsumTax}>
                </lightning-combobox>
            </div>
        </template>
        <template if:true={showLumpsumAmount}>
            <div class="slds-col slds-size_1-of-4">
                <lightning-input 
                    type="number" 
                    label="Lumpsum Discount Amount"
                    name="lumpsumAmount"
                    value={lumpsumAmount}
                    onchange={handleLumpsumChange}>
                </lightning-input>
            </div>
        </template>
        <template if:true={showLumpsumPercentage}>
            <div class="slds-col slds-size_1-of-4">
                <lightning-input 
                    type="number" 
                    label="Lumpsum Discount Percentage"
                    name="lumpsumPercentage"
                    value={lumpsumPercentage}
                    onchange={handleLumpsumChange}>
                </lightning-input>
            </div>
        </template>
    </div>
      <div class="calculation-wrapper">
        <div class="calculation-table">
            <table aria-multiselectable="true" class="slds-table slds-no-row-hover slds-table_bordered">
                <tbody>
                    <tr>
                        <td class="tdClass">Amount</td>
                        <td class="value-cell">{totalAmount}</td>
                    </tr>
                    <tr>
                        <td class="tdClass">Discount</td>
                        <td class="value-cell">{totalDiscount}</td>
                    </tr>
                    <tr>
                        <td class="tdClass">Subtotal</td>
                        <td class="value-cell">{calculatedSubTotal}</td>
                    </tr>
                    <tr>
                        <td class="tdClass">Tax Amount</td>
                        <td class="value-cell">{calculatedTaxAmount}</td>
                    </tr>
                    <tr>
                        <td class="tdClass">Total</td>
                        <td class="value-cell">{grandTotal}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <lightning-button label="Save" variant="brand" onclick={saveRecords} class="slds-m-top_small" disabled={isButtonDisabled}></lightning-button>
</lightning-card>
</template>
