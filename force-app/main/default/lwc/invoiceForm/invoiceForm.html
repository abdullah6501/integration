<template>
  <div class="slds-m-around_medium">
    <!-- Inner box with border and padding -->
    <div class="slds-box slds-theme_default"
      style="border: 1px solid #dddbda; border-radius: 0.25rem; padding: 1rem; margin-top: 1rem; width: 100%;">

      <div if:false={spinnerFlag} class="slds-is-relative">
        <lightning-spinner alternative-text="Loading..." variant="brand">
        </lightning-spinner>
      </div>

      <div style="display: flex; align-items: flex-start; gap: 2rem">
        <div style="flex: 1">
          <lightning-layout horizontal-align="start" class="slds-gutters slds-m-bottom_medium">
            <!-- Parent Account -->
            <lightning-layout-item size="3" class="slds-p-horizontal_x-small">
              <c-reusable-lookup if:false={parentAccountSelectedRecord.id} label="Parent Account"
                selected-icon-name="standard:account" object-label="Account" object-api-name="Account"
                field-api-name="Name" other-field-api-name="BillingStreet" additional-field-api-name={accOtherFieldApi}
                onvalueselected={handleValueSelectedOnAccount} onvalueremoval={handleAccValRemoval}>
              </c-reusable-lookup>
              <c-reusable-lookup if:true={parentAccountSelectedRecord.id} label="Parent Account"
                selected-icon-name="standard:account" object-label="Account" object-api-name="Account"
                field-api-name="Name" other-field-api-name="BillingStreet" additional-field-api-name={accOtherFieldApi}
                selected-record-id={parentAccountSelectedRecord.id} disable-flag={formDisableFlag}
                onvalueselected={handleValueSelectedOnAccount} onvalueremoval={handleAccValRemoval}>
              </c-reusable-lookup>
            </lightning-layout-item>

            <!-- Parent Contact -->
            <lightning-layout-item size="3" class="slds-p-horizontal_x-small">
              <c-reusable-lookup if:false={parentContactSelectedRecord.id} label="Parent Contact"
                selected-icon-name="standard:contact" object-label="Contact" object-api-name="Contact"
                field-api-name="Name" parent-record-id={parentAccountSelectedRecord.id}
                parent-field-api-name="AccountId" other-field-api-name="Email"
                additional-field-api-name={conAdditionalField} onvalueselected={handleValueSelectedOnContact}
                onvalueremoval={handleConValRemoval}>
              </c-reusable-lookup>
              <c-reusable-lookup if:true={parentContactSelectedRecord.id} label="Parent Contact"
                selected-icon-name="standard:contact" object-label="Contact" object-api-name="Contact"
                field-api-name="Name" parent-record-id={parentAccountSelectedRecord.id}
                parent-field-api-name="AccountId" other-field-api-name="Email"
                additional-field-api-name={conAdditionalField} disable-flag={formDisableFlag}
                selected-record-id={parentContactSelectedRecord.id} onvalueselected={handleValueSelectedOnContact}
                onvalueremoval={handleConValRemoval}>
              </c-reusable-lookup>
            </lightning-layout-item>

            <!-- Primary Contact Email -->
            <lightning-layout-item size="3" class="slds-p-horizontal_x-small">
              <lightning-input label="Primary Contact Email" type="email" value={primaryContactEmail}
                onchange={updateContactEmailList} disabled={formDisableFlag}>
              </lightning-input>
            </lightning-layout-item>


            <lightning-layout-item size="2" class="slds-p-horizontal_x-small">
              <div class="popup-trigger">
                <span class="cc-bcc-link" onclick={toggleCcBccPopup}>
                  Cc({ccListLength})/Bcc({bccListLength})
                </span>

                <!-- Popup Overlay (Dark Background) -->
                <template if:true={showCcBccPopup}>
                  <div class="popup-overlay" onclick={ccBccSecCancel}></div>
                </template>

                <!-- Centered Popup Content -->
                <template if:true={showCcBccPopup}>
                  <div class="popup-center">
                    <div class="popup-content slds-p-around_medium">
                      <lightning-input label="Cc" type="email" value={ccEmailAddressesStr} onchange={ccOnChange}
                        disabled={formDisableFlag}>
                      </lightning-input>
                      <lightning-input label="Bcc" type="email" value={bccEmailAddressesStr} onchange={bccOnChange}
                        disabled={formDisableFlag}>
                      </lightning-input>
                      <div class="slds-m-top_medium slds-text-align_right">
                        <lightning-button disabled={formDisableFlag} label="Cancel" variant="neutral"
                          onclick={ccBccSecCancel} class="slds-m-right_x-small">
                        </lightning-button>
                        <lightning-button disabled={formDisableFlag} label="Done" variant="brand"
                          onclick={ccBccSecDone}>
                        </lightning-button>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
            </lightning-layout-item>
          </lightning-layout>

          <lightning-layout horizontal-align="start" class="slds-gutters slds-m-bottom_medium">
            <!-- Billing Address -->
            <lightning-layout-item size="3" class="slds-p-horizontal_x-small">
              <lightning-textarea label="Billing Addresses" value={billingAddress} onchange={updateBillingAddress}
                disabled={formDisableFlag}>
              </lightning-textarea>
            </lightning-layout-item>
            <!-- Currency -->
            <lightning-layout-item style="width:15%" class="slds-p-horizontal_x-small">
              <lightning-combobox label="Currency" name="currency" options={currencyoptions} value={selectedCurrency}
                onchange={handleCurrencyChange} disabled={formDisableFlag}>
              </lightning-combobox>
            </lightning-layout-item>
            <!-- Terms -->
            <lightning-layout-item style="width:10%;" class="slds-p-horizontal_x-small">
              <lightning-combobox label="Terms" name="terms" options={termsOptions} value={chosenTerm}
                onchange={handleTermsChange} disabled={formDisableFlag}>
              </lightning-combobox>
            </lightning-layout-item>


            <!-- Invoice Date -->
            <lightning-layout-item size="1.5" class="slds-p-horizontal_x-small">
              <lightning-input label="Invoice Date" type="date" value={invoiceDate} onchange={invoiceDateChange}
                disabled={formDisableFlag}>
              </lightning-input>
            </lightning-layout-item>

            <!-- Due Date (disabled) -->
            <lightning-layout-item size="1.5" class="slds-p-horizontal_x-small">
              <lightning-input label="Due Date" type="date" disabled value={dueDate}>
              </lightning-input>
            </lightning-layout-item>
          </lightning-layout>

          <lightning-layout horizontal-align="start" class="slds-gutters slds-m-bottom_medium">




            <!-- Place of Supply -->
            <lightning-layout-item style="width:13%" class="slds-p-horizontal_x-small">
              <lightning-combobox label="Place of Supply" name="Place of Supply" options={supplyOption}
                value={selectedCountry} onchange={handleCountryChange} disabled={formDisableFlag}>
              </lightning-combobox>
            </lightning-layout-item>

            <!-- Authorized Sign -->
            <lightning-layout-item style="width:12%" class="slds-p-horizontal_x-small">
              <lightning-combobox label="Authorized Sign" name="Authroized Sign" options={autComboBoxList}
                value={authroizedSignature} onchange={handleAuthChange} disabled={formDisableFlag}>
              </lightning-combobox>
            </lightning-layout-item>

            <!-- Invoice Number -->
            <lightning-layout-item size="1.5" class="slds-p-horizontal_x-small">
              <lightning-input label="Invoice Number" disabled value={invNumber}>
              </lightning-input>
            </lightning-layout-item>
          </lightning-layout>
        </div>

        <!-- Right side: Balance Due -->
        <div style="text-align: right; margin-top: 2rem">
          <div class="slds-box slds-theme_default" style="background-color: #f3f3f3;
                    display: inline-grid;  
                    grid-template-columns: auto auto; 
                    align-items: center;   
                    gap: 0 1rem;          
                    padding: 1.5rem 2rem;
                    border: 1px solid #dddbda;
                    border-radius: 0.25rem;">
            <div class="slds-text-heading_small" style="grid-column: span 2;">BALANCE DUE</div>
            <div style="font-size: 2.5rem; 
                       font-weight: bold;
                       color: #080707;
                       text-align: right;">
              {currencyCode}
            </div>
            <div style="font-size: 2.5rem;
                       font-weight: bold;
                       color: #080707;
                       font-family: monospace; 
                       min-width: 150px;       
                       text-align: right;">
              {total}
            </div>
          </div>
        </div>
      </div>
      <!-- Dotted Line Separator -->
      <div class="slds-m-vertical_medium">
        <div style="border-bottom: 2px dashed #dddbda; width: 100%;"></div>
      </div>

      <!-- discount -->
      <div style="display: flex; justify-content: flex-end; align-items: flex-start; gap: 1rem; flex-wrap: wrap;">
        <!-- Amounts are (right-most) -->
        <div style="order: 1;">
          <div class="slds-form-element">
            <label class="slds-form-element__label" for="amountsAre">Amounts are</label>
            <div class="slds-form-element__control">
              <lightning-combobox name="Amounts are" variant="label-hidden" options={parentTaxOptions}
                onchange={handleParentTaxChange} value={chosenParentTaxOption} disabled={formDisableFlag}>
              </lightning-combobox>
            </div>
          </div>
        </div>

        <!-- Discount fields (middle) -->
        <template if:true={isDiscountEnabled}>
          <div style="order: 3; display: flex; gap: 1rem;">
            <div>
              <lightning-combobox name="Discount Mode" label="Discount Mode" value={selectedDiscountMode}
                options={discountoptions} onchange={handleDiscountMode} disabled={formDisableFlag}>
              </lightning-combobox>
            </div>
            <div>
              <lightning-combobox name="Discount Type" label="Discount Type" value={selectedDiscountType}
                options={discountTypeoptions} onchange={handleDiscountType} disabled={formDisableFlag}>
              </lightning-combobox>
            </div>
          </div>
        </template>

        <!-- Toggle (left-most) -->
        <div style="order: 2;">
          <div class="slds-form-element">
            <label class="slds-form-element__label">Discount</label>
            <div class="slds-form-element__control">
              <lightning-input type="toggle" checked={isDiscountEnabled} onchange={handleDiscountToggle}
                variant="label-hidden" class="discount-toggle" disabled={formDisableFlag}>
              </lightning-input>
            </div>
          </div>
        </div>
      </div>

      <!-- Added by Mohamed abdul kadher for dynamic table starts -->
      <div>
        <template if:true={isDataLoaded}>
          <c-table-creator table-field-metadata={tableFieldMetadata} ontabledataupdate={handleTableDataUpdate}
            formcontroller={formDisableFlag}>
          </c-table-creator>
        </template>

        <template if:false={isDataLoaded}>
          <div class="loading-container">
            <lightning-spinner alternative-text="Loading table data..." size="medium"></lightning-spinner>
            <p>Loading table configuration...</p>
          </div>
        </template>
      </div>
      <!-- Added by Mohamed abdul kadher for dynamic table Ends -->
      <div class="slds-grid slds-gutters" style="margin-top:2rem; justify-content: flex-end;">
        <!-- Lumpsum Discount Percentage Input -->
        <div if:true={showLumpsumPercentage} class="slds-col slds-size_1-of-6">
          <lightning-input type="number" label="Lumpsum Discount %" value={lumpsumDiscountPercentage}
            onchange={handleLumpsumDiscountPercentageChange} disabled={formDisableFlag}>
          </lightning-input>
        </div>

        <!-- Lumpsum Discount Amount Input -->
        <div if:true={showLumpsumAmount} class="slds-col slds-size_1-of-6">
          <lightning-input type="number" label="Lumpsum Discount Amount" value={lumpsumDiscountAmount} step="0.01"
            onchange={handleLumpsumDiscountAmountChange} disabled={formDisableFlag}>
          </lightning-input>
        </div>
      </div>
      <div if:true={itemList} class="slds-grid slds-grid_align-end slds-p-around_medium">
        <div class="slds-col slds-size_2-of-12">
          <div class="slds-grid slds-grid_vertical">
            <div class="slds-col">
              <div class="slds-grid">
                <div class="slds-col ">
                  <p class="slds-text-heading_small" style="padding: 4% 0%;">Subtotal({currencyCode}):</p>
                </div>
                <div class="slds-col  slds-text-align_right">
                  <p class="slds-text-heading_small" style="padding: 8% 0%;">{subtotal}</p>
                </div>
              </div>
            </div>
            <!-- Discoun summary -->
            <div class="slds-col">
              <div class="slds-grid">
                <div class="slds-col ">
                  <p class="slds-text-heading_small" style="padding: 4% 0%;">Discount({currencyCode}):</p>
                </div>
                <div class="slds-col  slds-text-align_right">
                  <p class="slds-text-heading_small" style="padding: 16% 0%;">{totalDiscount}</p>
                </div>
              </div>
            </div>
            <!-- Dynamic Tax Details -->
            <template for:each={uniqueTaxDetails} for:item="tax">
              <div class="slds-col" key={tax.taxName}>
                <div class="slds-grid">
                  <div class="slds-col ">
                    <p class="slds-text-heading_small" style="padding: 4% 0%;">{tax.taxName}({currencyCode}):</p>
                  </div>
                  <div class="slds-col  slds-text-align_right">
                    <p class="slds-text-heading_small" style="padding: 9% 0%;">{tax.taxAmount}</p>
                  </div>
                </div>
              </div>
            </template>

            <div class="slds-col">
              <div class="slds-grid" style="border-top: 1px solid #dddbda; margin-top: 0.5rem; padding-top: 0.5rem;">
                <div class="slds-col ">
                  <p class="slds-text-heading_small"><strong>Total({currencyCode}):</strong></p>
                </div>
                <div class="slds-col slds-text-align_right">
                  <p class="slds-text-heading_small"><strong>{total}</strong></p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div style="display: flex; justify-content: center; margin: 1rem;">
        <div class="slds-box"
          style="background-color: #eff6fc; padding: 1rem; margin-top: 1rem; border: 1px solid #d8dde6; border-radius: 0.25rem; width: 100%; ">
          <div class="slds-grid slds-wrap slds-gutters">
            <!-- Message on Invoice -->
            <div class="slds-col slds-size_1-of-3">
              <lightning-textarea class="custom-textarea" onkeyup={msgOnInvOnChange} label="Message on invoice"
                name="Message on invoice" value={msgOnInv} disabled={formDisableFlag}>
              </lightning-textarea>
            </div>

            <!-- Message on Statement -->
            <div class="slds-col slds-size_1-of-3">
              <lightning-textarea class="custom-textarea" onkeyup={msgOnStmtOnChange} label="Message on statement"
                name="Message on statement" value={msgOnStmt} disabled={formDisableFlag}>
              </lightning-textarea>
            </div>

            <!-- Terms and Conditions -->
            <div class="slds-col slds-size_1-of-3" if:true={termsAndCond}>
              <lightning-textarea class="custom-textarea" onkeyup={termsAndCondOnChange} label="Terms and Conditions"
                name="Terms and Conditions" value={termsAndCond} disabled={formDisableFlag}>
              </lightning-textarea>
            </div>
          </div>

          <!-- Bottom row with buttons and checkbox -->
          <div class="slds-grid slds-align_absolute-center slds-m-top_medium">
            <div class="slds-col slds-size_4-of-12">
              <lightning-input type="checkbox" label="Create Automated Journal Entries" onchange={handleCheckboxChange}
                disabled={formDisableFlag} class="slds-m-right_medium">
              </lightning-input>
            </div>

            <div class="slds-col slds-size_4-of-12 slds-text-align_left">
              <lightning-button label="Save" variant="brand" onclick={saveAction} disabled={saveDisableFlag}
                class="slds-m-right_x-small">
              </lightning-button>

              <lightning-button label="Save & Send" variant="brand" onclick={saveAndSendAction}
                disabled={saveDisableFlag}>
              </lightning-button>
            </div>

            <div class="slds-col slds-size_4-of-12 slds-text-align_right" if:true={recordId}>
              <lightning-button label="Preview Invoice PDF" variant="neutral" onclick={openVisualForcePage}
                disabled={formDisableFlag}>
              </lightning-button>
            </div>
          </div>
        </div>
      </div>


    </div>
  </div>

  <div class="slds-m-around_large">
    <div if:false={spinnerFlag} class="slds-is-relative">
      <lightning-spinner alternative-text="Loading..." variant="brand">
      </lightning-spinner>
    </div>
  </div>

  <div style={popupDivStyle}>
    <div style="height:5%;width:100%;text-align:end;">
      <lightning-icon if:true={vfPageURLToPreview} style="background:dimgrey;" icon-name="utility:close"
        alternative-text="close" onclick={hideModalBox} variant="inverse" size="small"></lightning-icon>
    </div>

    <iframe style="height:100%;width:100%" if:true={vfPageURLToPreview} src={vfPageURLToPreview}></iframe>
  </div>
  <!-- </lightning-card> -->
</template>
