<template>
  <!-- Utilizing Existing Components -->
  <div class="slds-scrollable" style={whStyle} tabindex="0">
    <template if:true={rowTypeTable}>
      <table style="width: 100%; height: auto">
        <thead>
          <tr>
            <template for:each={tableFieldList} for:item="field">
              <th key={field.name} style={field.widthStyle}>{field.label}</th>
            </template>
            <!-- VD NOV23 - action column- this will be from field meta -->
            <!-- VD 8feb25 print mode changes -->
            <th
              if:false={printMode}
              style="text-align: center"
              class="slds-no-print"
            >
              Actions
            </th>
          </tr>
        </thead>
        <tbody>
          <template
            for:each={tableRecordList}
            for:item="record"
            for:index="recIndex"
          >
            <tr
              key={record.recordId}
              onclick={handleSelect}
              data-id={record.recordId}
            >
              <template for:each={record.value} for:item="fv">
                <td key={fv.fieldName} style={fv.fieldStyle}>
                  <!-- MR 23NOV23 - used existing book-->
                  <!-- VD 07DEC23 - removed static variable-->
                  <!-- VD NOV23 fields with printmode and without printmode -->
                  <template if:false={printMode}>
                    <c-question-book
                      questions={fv.questions}
                      onselecteddata={inputChange}
                    ></c-question-book>
                  </template>
                  <template
                    if:true={printMode}
                    for:each={fv.questions}
                    for:item="fv"
                  >
                    <span key={fv.Id}>{fv.input}</span>
                  </template>
                </td>
              </template>
              <!-- VD NOV23 - action column- this will be from field meta -->
              <td
                if:false={printMode}
                class="slds-no-print"
                style="text-align: center"
              >
                <lightning-icon
                  icon-name="utility:delete"
                  size="small"
                  alternative-text="Delete"
                  onclick={delIconClicked}
                  data-id={record.recordId}
                ></lightning-icon>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
      <!-- VD 16NOV23 - no print class added-->
      <!-- VD NOV23 - printmode update-->
      <div if:false={printMode} class="slds-no-print add-record">
        <lightning-button
          label="Add Record"
          onclick={addRecord}
          slot="actions"
        ></lightning-button>
      </div>
    </template>

    <template if:true={blockTypeTable}>
      <template
        for:each={tableRecordList}
        for:item="record"
        for:index="recordIndex"
      >
        <div
          key={record.recordId}
          onclick={handleSelect}
          data-id={record.recordId}
        >
          <template
            for:each={tableFieldList}
            for:item="field"
            for:index="fieldIndex"
          >
            <div
              key={field.recordId}
              class="slds-grid slds-gutters slds-var-p-around_medium"
            ></div>
          </template>
        </div>
      </template>
      <lightning-card>
        <template for:each={blockActions} for:item="actionItem">
          <lightning-button
            key={actionItem.label}
            label={actionItem.label}
            onclick={actionItem.event}
            slot="actions"
          ></lightning-button>
        </template>
      </lightning-card>
    </template>
  </div>
  <!-- VD 23jul24 - model to fill the required fields-->
  <template if:true={isAddRecord}>
    <section
      role="dialog"
      tabindex="-1"
      aria-labelledby="modal-heading-01"
      aria-modal="true"
      aria-describedby="modal-content-id-1"
      class="slds-modal slds-modal-backdrop-color-background slds-fade-in-open"
      style="background-color: rgba(11, 11, 11, 0.6)"
    >
      <div class="slds-modal__container">
        <header class="slds-modal__header">
          <button
            class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
            title="Close"
            onclick={closeModel}
          >
            <lightning-icon
              icon-name="utility:close"
              alternative-text="close"
              variant="inverse"
              size="small"
              style="color: gray"
            ></lightning-icon>
            <span class="slds-assistive-text">Close</span>
          </button>
          <h2
            id="modal-heading-01"
            class="slds-text-heading_medium slds-hyphenate"
          >
            Fill the required Fields
          </h2>
        </header>
        <div
          class="slds-modal__content slds-p-around_medium"
          id="modal-content-id-1"
        >
          <lightning-record-edit-form object-api-name={objectApiName}>
            <div class="slds-grid slds-wrap">
              <template for:each={requiredFields} for:item="field">
                <div
                  key={field.name}
                  class="slds-col slds-size_1-of-2 slds-p-horizontal_x-small"
                >
                  <lightning-input-field
                    field-name={field.name}
                    onchange={newInputChange}
                  ></lightning-input-field>
                </div>
              </template>
            </div>
            <div class="slds-m-top_medium slds-text-align_center">
              <lightning-button
                variant="Nutral"
                label="Cancel"
                title="Cancel"
                onclick={closeModel}
                class="slds-m-right_x-small"
              ></lightning-button>
              <lightning-button
                variant="brand"
                label="Save"
                onclick={handleNewRecordSave}
              ></lightning-button>
            </div>
          </lightning-record-edit-form>
        </div>
        <!-- <footer class="slds-modal__footer">
                    <div class="slds-col slds-col slds-size_4-of-4 slds-p-around-large slds-align_absolute-Center  slds-text-align_center">
                        <lightning-button variant="brand"  label="Save" title="Save" onclick={handleSave} class="slds-m-left_x-small"></lightning-button>
                        <lightning-button variant="Nutral" label="Cancel" title="Cancel" onclick={closeModel} class="slds-m-left_x-small"></lightning-button>
                    </div>
                </footer> -->
      </div>
    </section>
  </template>
  <template if:true={loading}>
    <div class="slds-spinner slds-spinner_large">
      <div class="slds-spinner__dot-a"></div>
      <div class="slds-spinner__dot-b"></div>
    </div>
  </template>
</template>
