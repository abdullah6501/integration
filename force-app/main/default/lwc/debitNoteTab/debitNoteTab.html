<!--KK 25/Jul/25 - Debit Note Component to create debit Notes
 Tableconfig implemented-->
 <!-- Abdullah V S | 22-Aug-25 | Dynamically sets visibility, read-only, and required flags for fields -->
<template>
    <lightning-card>
        <!-- Header Section -->
		<div class="slds-grid slds-wrap slds-p-around_medium">
			<div class="slds-col slds-size_1-of-1">
				<div class="slds-grid slds-gutters_small">
					<div class="slds-col slds-size_1-of-6">
						<div class="slds-form-element">
							<lightning-input label="Debit Note No" placeholder="Debit Note no" value={debitNote.name} onchange={handleInputChange} data-id="Name" disabled={isNotDisable}></lightning-input>
						</div>
					</div>
                    <div class="slds-col slds-size_1-of-6">
						<div class="slds-form-element">
							<lightning-combobox label="Reference Link From" placeholder="Select the type" value={debitNote.referenceType} options={referenceTypeOptions} onchange={handleInputChange} data-id="referenceType" disabled={isFormDisabled}></lightning-combobox>
						</div>
					</div>
					<div class="slds-col slds-size_1-of-6">
						<div class="slds-form-element slds-col ">
							<c-reusable-lookup 
								label="Bill/PO Number" 
								selected-icon-name="standard:account"
								object-api-name={currentObjectApiName}
								field-api-name="Name"
								other-field-api-name={currentOtherFieldApiName}
								additional-field-api-name={currentAdditionalFieldApiName}
								selected-record-id={currentSelectedRecord.id}
								onvalueselected={handleLookupSelection}
								disable-flag={isFormDisabled}>
							</c-reusable-lookup>
						</div>
					</div>

                    <div class="slds-col slds-size_1-of-6">
						<div class="slds-form-element">
							<lightning-combobox label="Select Category" placeholder="Select the type" value={debitNote.category} options={categoryOptions} onchange={handleInputChange} data-id="category" disabled={isFormDisabled}></lightning-combobox>
						</div>
					</div>
				</div>
			</div>
			<div class="slds-col slds-size_1-of-1">
				<div class="slds-grid slds-gutters_small">
					<div class="slds-col slds-size_1-of-6">
						<div class="slds-form-element">
							<lightning-input label="Vendor" placeholder="Auto Select From Reference" value={debitNote.vendorName} onchange={handleInputChange} data-id="vendorName" disabled={isNotDisable}></lightning-input>
						</div>
					</div>
                    <div class="slds-col slds-size_1-of-6">
						<div class="slds-form-element">
							<lightning-input type="date" label="Bill Date" placeholder="DD/MM/YYYY" value={debitNote.billDate} onchange={handleInputChange} data-id="billDate" disabled={isFormDisabled}></lightning-input>
						</div>
					</div>
					<div class="slds-col slds-size_1-of-6">
						<div class="slds-form-element slds-p-top_small createVoucherEntries">
							<lightning-input type="checkbox" label="Create Voucher Entry" checked={debitNote.createJournalEntry} onchange={handleCheckboxChange} data-id="createJournalEntry" disabled={isFormDisabled}></lightning-input>
						</div>
					</div>
                    <div class="slds-col slds-size_1-of-6">
						<div class="slds-form-element slds-p-top_small createVoucherEntries">
							<lightning-input type="checkbox" label="Cash Return" checked={debitNote.cashReturn} onchange={handleCheckboxChange} data-id="cashReturn" disabled={isFormDisabled}></lightning-input>
						</div>
					</div>
					<!-- Total Amount Section - Now aligned with the form row -->
					<div class="slds-col slds-size_1-of-6">
                        <div class="grand-total-section-inline">
                            <!-- AP-04AUG25 Right Side Total Section -->
                        <div class="total-amount-section">
                          <div class="slds-text-heading_small" style="grid-column: span 2;">Total Amount</div>
                          <!-- AP-04AUG25 {currencyCode} Replace currencyDisplay -->
                          <div class="currency">{currencyDisplay}</div>
                          <div class="total-amount">{grandTotal}</div>
                          <template if:true={amountInWords}>
                            <div style="grid-column: span 2; font-weight: bold;">{amountInWords}</div>
                          </template>
                        </div>
                        </div>
                      </div>
				</div>
				
				<div class="slds-grid slds-gutters_small">
					<div class="slds-col slds-size_2-of-6">
						<div class="slds-form-element">
							<lightning-input label="Reason" placeholder="Reason" value={debitNote.reason} onchange={handleInputChange} data-id="reason" disabled={isFormDisabled}></lightning-input>
						</div>
					</div>
				</div>
			
			</div>
		</div>
        <!-- Product Details Section with compact controls -->
		<div class="slds-m-around_medium">
			<div class="slds-grid slds-gutters_small slds-p-bottom_small">
				<!-- Left side: Product Details -->
				<div class="slds-col slds-size_1-of-2">
					<div class="slds-text-heading_small" style="font-size:20px; font-weight: bold;">Product Details</div>
				</div>
			</div>
		</div>
        <!-- Product Detail Table -->
		<div class="slds-p-top_medium">
			<table class="slds-table slds-table_bordered custom-header-row">
				<!--slds-size_12-of-12-->
				<thead>
					<tr>
						<th class="slds-cell_action-mode header-cell" width="50px"></th>
                        <template if:true={isItemNumberVisible.visible}>
							<th style={isItemNumberVisible.sldsSize}>
								<div class="slds-truncate slds-text-align_center">{isItemNumberVisible.label}</div>
							</th>
						</template>
						<template if:true={isProductVisible.visible}>
							<th style={isProductVisible.sldsSize}>
								<div class="slds-truncate slds-text-align_center">{isProductVisible.label}</div>
							</th>
						</template>
						<template if:true={isDescriptionVisible.visible}>
							<th style={isDescriptionVisible.sldsSize}>
								<div class="slds-truncate slds-text-align_center">{isDescriptionVisible.label}</div>
							</th>
						</template>
						<template if:true={isQuantityReturnVisible.visible}>
							<th style ={isQuantityReturnVisible.sldsSize}>
								<div class="slds-truncate slds-text-align_center">{isQuantityReturnVisible.label}</div>
							</th>
						</template>
                        <template if:true={isUnitPriceVisible.visible}>
							<th style={isUnitPriceVisible.sldsSize}>
								<div class="slds-truncate slds-text-align_center">{isUnitPriceVisible.label}</div>
							</th>
						</template>
						<template if:true={isAmount.visible}>
							<th style={isAmount.sldsSize}>
								<div class="slds-truncate slds-text-align_center">{isAmount.label}</div>
							</th>
						</template>
						<template if:true={isTaxVisible.visible}>
							<th style={isTaxVisible.sldsSize}>
								<div class="slds-truncate slds-text-align_center">{isTaxVisible.label}</div>
							</th>
						</template>
						<template if:true={isTaxAmountVisible.visible}>
							<th style={isTaxAmountVisible.sldsSize}>
								<div class="slds-truncate slds-text-align_center">{isTaxAmountVisible.label}</div>
							</th>
						</template>
                        <template if:true={isTotalAmountVisible.visible}>
							<th style={isTotalAmountVisible.sldsSize}>
								<div class="slds-truncate slds-text-align_center">{isTotalAmountVisible.label}</div>
							</th>
						</template>
						<th style="width: 3.25rem">
							<lightning-button-icon
								icon-name="utility:delete"
								variant="bare"></lightning-button-icon>
						</th>
					</tr>
				</thead>
				<template if:true={showTable}>
					<tbody>
					<template for:each={allDebitNoteItems} for:item="item" for:index="index">
						<tr key={item.keyField} class="slds-hint-parent" data-index={index}>
							<td class="tableStyle slds-cell_action-mode" role="gridcell">
								<div class="slds-p-top_x-small">
									<svg
										xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" height="11" width="11">
										<rect width="256" height="256" fill="none"></rect>
										<circle cx="60" cy="92" r="16"></circle>
										<circle cx="128" cy="92" r="16"></circle>
										<circle cx="196" cy="92" r="16"></circle>
										<circle cx="60" cy="164" r="16"></circle>
										<circle cx="128" cy="164" r="16"></circle>
										<circle cx="196" cy="164" r="16"></circle>
									</svg>
								</div>
							</td>
							<td class="slds-cell_action-mode">
								<div class="slds-truncate">{item.lineNumber}</div>
							</td>
							<td if:true={isProductVisible.visible} style={isProductVisible.sldsSize}>
								<div>
									<c-reusable-lookup if:true={item.productId}
										label=""
										selected-icon-name="standard:product"
										object-label={productLabel}
										object-api-name={productObjectApiName}
										additional-field-api-name={productAdditionalFieldApiName}
										field-api-name="Name"
										other-field-api-name={productOtherFieldApiName}
										row-id={index}
										data-index={index}
										selected-record-id={item.productId}
										disable-flag={isNotDisable}></c-reusable-lookup>
								</div>
							</td>
							<td if:true={isDescriptionVisible.visible} style={isDescriptionVisible.sldsSize}>
								<div >
									<!--style={isDescriptionVisible.sldsSize}-->
									<lightning-textarea 
										value={item.description} 
										data-index={index} 
										data-id="description" 
										disabled={isNotDisable}></lightning-textarea>
								</div>
							</td>
                            <td if:true={isQuantityReturnVisible.visible} style={isQuantityReturnVisible.sldsSize}>
								<div>
									<lightning-input 
									type="number" 
									value={item.quantityReturn} 
									data-index={index} 
									data-id="quantityReturn" 
									onchange={handleItemChange}
									disabled={isFormDisabled}
									required={isQuantityReturnVisible.required} 
									class={isQuantityReturnVisible.requiredClass}></lightning-input>
								</div>
							</td>
							<td if:true={isUnitPriceVisible.visible} style={isUnitPriceVisible.sldsSize}>
								<div>
									<lightning-input 
									type="number" 
									step="0.01"
									value={item.unitPrice} 
									data-index={index} 
									data-id="unitPrice" 
									disabled={isNotDisable}></lightning-input>
								</div>
							</td>
							<td if:true={isAmount.visible} style={isAmount.sldsSize}>
								<div class="slds-text-align_center">
									<lightning-input 
									type="number" 
									value={item.amount}
									disabled={isNotDisable}></lightning-input>
									<!-- <lightning-formatted-number 
										value={item.amount}></lightning-formatted-number> -->
								</div>
							</td>
							<td if:true={isTaxVisible.visible} style={isTaxVisible.sldsSize} >
								<div >
									<lightning-input
									type="text"
									value={item.taxName}
									data-id="taxRate"
									disabled={isNotDisable}>
									</lightning-input>
								</div>
							</td>
							<td if:true={isTaxAmountVisible.visible}  style={isTaxVisible.sldsSize} >
								<div class="slds-text-align_center">
									<lightning-input 
									type="number" 
									value={item.taxAmount}
									disabled={isNotDisable}></lightning-input>
								</div>
							</td>
                            <td if:true={isTotalAmountVisible.visible} style={isTotalAmountVisible.sldsSize}>
								<div class="slds-text-align_center">
									<lightning-input 
									type="number" 
									value={item.totalAmount}
									disabled={isNotDisable}></lightning-input>
								</div>
							</td>
							<td>
								<div class="delete-icon-container">
									<lightning-button-icon 
										icon-name="utility:delete" 
										variant="bare"
										class="slds-m-left_xx-small"
										alternative-text="Remove Item" 
										title="Remove Item" 
										data-index={index}
										onclick={removeItem}>
									</lightning-button-icon>
								</div>
							</td>
						</tr>
					</template>
				</tbody>
				</template>
			</table>
		</div>
		<template if:true={showTable}>
			 <div class="slds-grid slds-grid_align-end slds-p-top_medium slds-p-horizontal_medium">
				<!-- Summary Section -->
				<div class="slds-col slds-size_3-of-12 slds-text-align_right">
					<!-- Sub Total -->
					<div class="slds-grid slds-m-vertical_xx-small">
						<div class="slds-col slds-size_1-of-2 slds-text-align_left">
							<span class="slds-text-body_regular">Sub Total ({currencyDisplay} )</span>
						</div>
						<div class="slds-col slds-size_1-of-2 slds-text-align_right">
							<lightning-formatted-number 
								value={subtotal} 
								minimum-fraction-digits="2"></lightning-formatted-number>
						</div>
					</div>
					<!-- Sum of Tax -->
					<div if:true={showTaxDetailsSection} class="slds-grid slds-m-vertical_xx-small">
						<div class="slds-col slds-size_1-of-2 slds-text-align_left">
							<span class="slds-text-body_regular">Sum of Tax</span>
						</div>
						<div class="slds-col slds-size_1-of-2 slds-text-align_right">
							<lightning-formatted-number 
								value={taxTotal} 
								minimum-fraction-digits="2"></lightning-formatted-number>
						</div>
					</div>
					<!-- Total -->
					<div class="slds-grid slds-m-vertical_xx-small slds-border-top">
						<div class="slds-col slds-size_1-of-2 slds-text-align_left">
							<span class="slds-text-heading_small">Total ( {currencyDisplay})</span>
						</div>
						<div class="slds-col slds-size_1-of-2 slds-text-align_right">
							<lightning-formatted-number 
								value={grandTotal} 
								minimum-fraction-digits="2"></lightning-formatted-number>
						</div>
					</div>
				</div>
			</div>
			<!-- Message Input at the very bottom -->
			<div class="slds-grid slds-grid_align-center slds-p-top_large">
				<div class="slds-col slds-size_1-of-1 custom-message-box-wrapper">
					<lightning-textarea
						label="Message / Statement"
						placeholder="Enter your message and statement here!"
						value={debitNote.message}
						onchange={handleInputChange}
						data-id="message"
						disabled={isFormDisabled}
						class="custom-message-box"
						></lightning-textarea>
				</div>
			</div>
		</template>
       
        <!-- Save/Cancel Buttons -->
		<div class="slds-grid slds-grid_align-center slds-p-top_large">
			<lightning-button variant="neutral" label="Cancel" onclick={handleCancel} class="slds-m-right_x-small"></lightning-button>
			<lightning-button variant="brand" label="Save" onclick={handleSave} class="slds-m-right_x-small" disabled={isButtonDisabled}></lightning-button>
		</div>
    </lightning-card>
</template>
